name: Update Profile README

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # every day at midnight UTC
  workflow_dispatch:       # manual trigger button in GitHub Actions UI

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests python-dateutil lxml

      - name: Run update script
        env:
          ACCESS_TOKEN: ${{ github.token }}
          USER_NAME: Kyazs
        run: python today.py

      - name: Commit and push updated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --staged --quiet || git commit -m "chore: update profile stats"
          git push
